name: TeamPlan QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install QA dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run TeamPlan browser QA
        run: npm run test:qa

      - name: Upload QA report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teamplan-qa-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
